<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Arreglos con JS</title>
    <style>
        *{
            transition: all 0.2s ease-in-out;
        }
        input, select{
            outline: none;
            border: none;
            border-bottom: 1px solid #7e7e7e;
            border-radius: 0;
            background-color: transparent;
        }
        input:focus, select:focus{
            border-bottom: 1px solid #000;
            font-size: large;
        }
    </style>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Programa Concierto</h1>
    </header>
    <section class="container-fluid m-5 row">
        <h3 class="text-center">Llena la información para tu compra</h3>
          <article class="col-sm-6 mx-auto">
            <article id="informacionCompra" class="col-sm-6">
                    <section class="d-flex">
                        <label>Nombre:</label>
                        <input type="text" min="1" id="nombre" class="me-3"placeholder="Nombre">
                        <label>RFC:</label>
                        <input type="text" min="1" max="13" id="rfc" placeholder="RFC">
                    </section> 
                    <label class="mt-3">Artista show:</label>
                    <select id="artista">
                        <option value="Mozart">Mozart</option>
                        <option value="vivaldi">Vivaldi</option>
                        <option value="bach">Bach</option>
                    </select>
                    <br>
                    <section class="d-flex mt-3">
                        <label>Adultos:</label>
                        <input type="number" min="1" id="adultos" class="me-3" placeholder="Adultos">
                        <label>Niños:</label>
                        <input type="number" min="0" id="ninos" placeholder="Niños">
                    </section>
            </article>
            <button type="button" class="btn btn-success mt-5 float-end" onclick="calcPersonas()">Hacer compra</button>
          </article>
    </section>
    <footer class="container-fluid p-5 bg-primary text-white text-center position-absolute bottom-0 start-50 translate-middle-x">
        <h3>LDSM 405</h3>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
