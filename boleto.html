<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Arreglos con JS</title>
</head>

<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Programa Concierto</h1>
    </header>
    <main class="container m-auto mb-5 row">
        <h2>Información de tu compra</h2>
        <section class="card p-4 shadow">
            <h3>Detalle del Boleto</h3>
            <article class="d-flex justify-content-around">
                <artcle class="linea-detalle">
                    <h4>Cliente:</h4>
                    <span id="resNombre"></span>
                </artcle>
                <article>
                    <h4>RFC:</h4>
                    <span id="resRfc"></span>
                </article>
            </article>
            <hr>
            <article class="mx-auto">
                <h4 class="d-inline">Artista:</h4>
                <span id="resArtista"></span>
            </article>
            <article class="d-flex justify-content-around">
                <article>
                    <h4>Adultos:</h4>
                    <span id="resAdultos"></span>
                </article>
                <article>
                    <h4>Niños:</h4>
                    <span id="resNinos"></span>
                </article>
            </article>
            <article class="d-flex justify-content-around">
                <article>
                    <h4>Subtotal Adultos:</h4>
                    <span id="resPrecioAdulto"></span>
                </article>
                <article>
                    <h4>Subtotal Niños:</h4>
                    <span id="resPrecioNino"></span>
                </article>
            </article>
            <article class="mx-auto">
                <h4>Total a pagar:</h4>
                <span id="resTotal"></span>
            </article>
            <article class="d-flex justify-content-around">
                <article>
                    <h4>Total de Personas:</h4>
                    <span id="resTotPersona"></span>
                </article>
                <article>
                    <h4>Zona:</h4>
                    <span id="resZona"></span>
                </article>
            </article>
        </section>
        </article>
    </main>
    <footer class="container-fluid p-5 bg-primary text-white text-center">
        <h3>LDSM 405</h3>
    </footer>
    <script src="js/boleto.js"></script>
</body>

</html>
